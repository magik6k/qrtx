[workspace]
resolver = "3"
members = ["crates/proto", "crates/cli", "crates/web"]
# the web crate only makes sense for wasm32-unknown-unknown
default-members = ["crates/proto", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
qrtx-proto = { path = "crates/proto" }
iroh = { version = "1.3", default-features = false }
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
data-encoding = "2.9"
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
